# Muse Glimmer-30B (Meta Superintelligence Lab) on Linux ROCm gfx1151 — full search.
#
# Dense 29.6B VLM, 52-layer decoder, hidden 6656, GQA 32/2, SwiGLU,
# gated attention, sliding/full [L,L,L,G]×13. Closest in-tree analogue is
# Gemma 4 (gated attn + hybrid window + VLM wrapper) but this first search
# uses the local LFM/Ling o_proj+down_proj projected recipe that already
# runs on this box. Native BF16; transformers 5.15 isolated env.
#
# BF16 OOM'd UMA. Full search uses bnb NF4 + angular (direct cannot
# edit packed 4-bit weights; LoRA was eaten by 4×RMSNorm).

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 1
min_batch_size = 1
max_batch_size = 1
skip_common_response_prefix = false
min_gen_tokens = 64
max_gen_tokens = 200

[steering]
steering_mode = "angular"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [1.0, 6.0]
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
]
auto_disable_components = ["mlp.down_proj"]
auto_disable_floor = -0.25

[steering.component_strength_ranges]
"attn.o_proj" = [1.0, 6.0]
"mlp.down_proj" = [0.0, 6.0]

[optimization]
num_trials = 60
num_warmup_trials = 20
checkpoint_dir = "checkpoints_muse_glimmer_30b"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 100
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = false
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
