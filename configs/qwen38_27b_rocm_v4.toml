# Qwen3.8-27B v4 — original weights, KL-capped, Q/K/V unlocked.
#
# v3 (o_proj+down_proj only, o_proj≤3.5): empty box. The two trials
# that stayed under KL 0.08 were both ~75/100. v1 showed 10/100 needs
# o_proj≈5.3 and costs KL 0.18. Unlock the 16 full-attn Q/K/V so TPE
# can spend a smaller KL budget on the actual attention read/write
# instead of cranking every-layer o_proj. Same residual cache as v1/v3.

[model]
model_id = "/run/media/s117/OS/Models/Qwen3.8-27B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/qwen38_encode.py"
custom_encoder_kwargs = {enable_thinking = false}

[inference]
batch_size = 256
min_batch_size = 1
max_batch_size = 256
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "lora"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [0.0, 3.5]
disabled_components = []

[steering.component_strength_ranges]
"attn.q_proj" = [0.0, 2.5]
"attn.k_proj" = [0.0, 2.5]
"attn.v_proj" = [0.0, 2.5]
"attn.o_proj" = [0.3, 3.5]
"mlp.down_proj" = [0.0, 1.5]

[optimization]
num_trials = 40
num_warmup_trials = 14
sampler_seed = 417
checkpoint_dir = "checkpoints_qwen38_27b_v4"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 16
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.03
prune_threshold = 0.08

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
