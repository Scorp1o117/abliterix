# Ornith-1.5-35B-A3B — MPOA like 1.0 Trial 63, wider strength than 1.0.
#
# 1.0 t62 was KL=0.028 / 11 refusals at o_proj≈2.05. 1.5 v1 search with
# [0.5, 2.1] pruned 28/28 trials at 28–30/30 prescreen. Sister Qwen3.5-35B-A3B
# winners used [1, 10] on down_proj. MTP already in the 16 shards.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ornith-1.5-35B-A3B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
# No max_memory: that forces accelerate per-tensor H2D and a CPU+GPU
# double copy (killed the 67G BF16 load at ~7.7G MemAvailable).
trust_remote_code = true

[inference]
batch_size = 128
min_batch_size = 1
max_batch_size = 128
skip_common_response_prefix = true
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "lora"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "full"
full_norm_lora_rank = 3
discriminative_layer_selection = false
search_harmfulness_direction = false
strength_range = [0.8, 10.0]
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
]

[steering.component_strength_ranges]
"attn.o_proj" = [1.0, 8.0]
"mlp.down_proj" = [1.0, 10.0]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 60
num_warmup_trials = 20
sampler_seed = 117
checkpoint_dir = "checkpoints_ornith15_35b_wide"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 20
generation_health_enabled = true
thinking_leak_detection_enabled = true

# Weak 1.0-style seed (already known not to pass 1.5 prescreen).
[[optimization.seed_trials]]
vector_scope = "global"
vector_index = 21.66
"attn.o_proj.max_weight" = 2.05
"attn.o_proj.max_weight_position" = 21.63
"attn.o_proj.min_weight" = 1.55
"attn.o_proj.min_weight_distance" = 8.0
"mlp.down_proj.max_weight" = 1.84
"mlp.down_proj.max_weight_position" = 33.60
"mlp.down_proj.min_weight" = 1.64
"mlp.down_proj.min_weight_distance" = 8.0

# Stronger MoE-style seed (Qwen3.5-35B-A3B winner ballpark).
[[optimization.seed_trials]]
vector_scope = "global"
vector_index = 22.0
"attn.o_proj.max_weight" = 5.0
"attn.o_proj.max_weight_position" = 22.0
"attn.o_proj.min_weight" = 2.5
"attn.o_proj.min_weight_distance" = 10.0
"mlp.down_proj.max_weight" = 6.0
"mlp.down_proj.max_weight_position" = 30.0
"mlp.down_proj.min_weight" = 3.0
"mlp.down_proj.min_weight_distance" = 10.0

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.6

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true

[benign_prompts]
dataset = "datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "datasets/good_1000"
split = "train[800:900]"
column = "prompt"

[target_eval_prompts]
dataset = "datasets/harmful_1000"
split = "train[800:900]"
column = "prompt"
