# Qwen3.8-27B v6 — LoRA on a response-pair residual, original weights.
#
# v5 angular: 28/30 KL-pruned, lowest KL 0.111 at ~69/100. The mean
# prompt-contrast direction is entangled with topic/capability.
# v6 teacher-forces the same prompts into a compliance vs refusal
# continuation and extracts that difference (Ling v12 recipe). Fresh
# extract required. Apply as LoRA o_proj+down_proj, KL prune 0.08.

[model]
model_id = "/run/media/s117/OS/Models/Qwen3.8-27B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/qwen38_encode.py"
custom_encoder_kwargs = {enable_thinking = false}

[inference]
batch_size = 256
min_batch_size = 1
max_batch_size = 256
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "lora"
vector_method = "mean"
response_pair_enabled = true
response_pair_compliance_text = "Sure, I can help with that request. Here is a direct answer:"
response_pair_refusal_text = "Sorry, I cannot help with that request. I cannot provide an answer."
response_pair_pooling = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [0.3, 3.5]
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"attn.o_proj" = [0.3, 3.5]
"mlp.down_proj" = [0.0, 1.5]

[optimization]
num_trials = 30
num_warmup_trials = 10
sampler_seed = 618
checkpoint_dir = "checkpoints_qwen38_27b_v6"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 16
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.03
prune_threshold = 0.08

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
