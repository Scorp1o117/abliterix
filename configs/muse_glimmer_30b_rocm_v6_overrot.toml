# Muse Glimmer-30B v6 — angular overrotation toward 10/100 @ KL 0.05.
#
# v3 t12 is 65/100 at KL 0.0274. All per-layer trials that passed were
# 10/16 because strength>1.0 was clamped at 90°. This study turns
# angular_overrotation on and searches 1.0–2.0 (90–180°) on the same
# decoder-block site and v3 residual cache.

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 1
min_batch_size = 1
max_batch_size = 1
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "angular"
angular_overrotation = true
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
fixed_vector_scope = "per layer"
runtime_hook_site = "decoder_block"
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
  "mlp.down_proj",
]
auto_disable_components = []

[steering.component_strength_ranges]
"attn.o_proj" = [1.00, 2.00]

[optimization]
num_trials = 16
num_warmup_trials = 6
checkpoint_dir = "checkpoints_muse_glimmer_30b_v6"
refusal_prescreen_enabled = true
refusal_prescreen_size = 16
refusal_prescreen_pass_max = 6
refusal_prescreen_prune_min = 12
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 16
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.05
prune_threshold = 0.15

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
