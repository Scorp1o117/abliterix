# Muse Glimmer-30B v5 — BF16 direct search (shippable weights).
#
# v3 angular trial 12 is 10/16 but runtime-only. Baking those numbers as
# direct was 15/16: angular strength is a 90° budget, direct is a linear
# coefficient. This study searches direct in its own units.
#
# Reuses v3 residual + baseline caches (same direction fields, prompts,
# seed, gen lengths). Do not re-extract hidden states.
# Prefix file must be ` to=user`. Launch with ABLITERIX_UMA_MIN_FREE_GB=4
# so the BF16 load spike does not trip the 24G extract guard.

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "96GB", "cpu" = "16GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 1
min_batch_size = 1
max_batch_size = 1
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "direct"
direct_transform = "standard"
search_direct_transform = true
search_direct_transform_choices = ["standard", "orba", "biprojected"]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "full"
fixed_vector_scope = "per layer"
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
]
auto_disable_components = []

[steering.component_strength_ranges]
"attn.o_proj" = [0.25, 1.60]
"mlp.down_proj" = [0.25, 1.60]

[optimization]
num_trials = 18
num_warmup_trials = 6
checkpoint_dir = "checkpoints_muse_glimmer_30b_v5"
refusal_prescreen_enabled = true
refusal_prescreen_size = 16
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 13
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 16
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
