# Ling-3.0-flash v13 — runtime causal probe at decoder-block outputs
#
# This is deliberately NOT another static LoRA search.  Adaptive angular
# hooks remove the refusal direction only from positively aligned token
# activations.  The optimiser searches the intervention's layer peak, width,
# and bounded removal fraction; this tells us whether a conditional residual
# intervention can break the static v6/v9 KL/refusal frontier.
#
# Stop/continue rule:
#   - positive signal: refusal <= 12/30 at prescreen with validation KL <= 0.08
#   - strong signal: full refusal <= 17/98 with KL < 0.08, or KL <= 0.05 with
#     refusal < 20/98
#   - otherwise stop after 18 trials and move localization inside KDA/MoE.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160
offload_outputs_to_cpu = true

[steering]
vector_method = "mean"
steering_mode = "adaptive_angular"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = false
fixed_vector_scope = "per layer"

# Runtime strength is a bounded fraction of the 90-degree removal arc.
strength_range = [0.10, 1.00]
min_weight_frac_max = 0.35
auto_disable_components = []

# The hook is attached to decoder block outputs, so one synthetic profile is
# sufficient.  Keeping only attn.o_proj avoids sampling duplicate profile
# dimensions that the runtime hook would ignore.
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
  "mlp.down_proj",
]

[steering.component_strength_ranges]
"attn.o_proj" = [0.10, 1.00]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 18
num_warmup_trials = 9
checkpoint_dir = "checkpoints_ling30_flash_v13_adaptive_runtime"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 12
refusal_prescreen_prune_min = 20
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.70

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
