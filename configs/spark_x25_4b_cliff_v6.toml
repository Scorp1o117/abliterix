# Spark-X2.5-4B — cliff-head + response-pair LoRA
#
# V5 mean LoRA: 7/100 @ KL 0.20, or KL 0.066 @ ~60/100. Same method cannot
# hit both bars. Spark is a thinking model; cliff-head ablates the sparse
# refusal heads (Bao 2025) as a static mergeable edit, then LoRA searches
# a residual-pair direction that isolates refusal from topic.

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Spark-X2.5-4B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true

[inference]
batch_size = 64
min_batch_size = 1
max_batch_size = 64
max_gen_tokens = 150
skip_common_response_prefix = true

[steering]
vector_method = "mean"
steering_mode = "lora"
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = true
decay_kernel = "gaussian"
weight_normalization = "full"
full_norm_lora_rank = 3
orthogonal_projection = true
response_pair_enabled = true
response_pair_pooling = "last"
cliff_head_ablation = true
cliff_head_top_k_frac = 0.05
cliff_head_strength = 1.0
strength_range = [0.6, 6.0]
auto_disable_components = ["mlp.down_proj"]
auto_disable_floor = -0.3
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"attn.o_proj" = [1.5, 6.0]
"attn.qkv_proj" = [0.4, 3.5]
"mlp.down_proj" = [0.10, 1.2]

[optimization]
num_trials = 60
num_warmup_trials = 18
checkpoint_dir = "checkpoints_spark_x25_4b_cliff_v6"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 100
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.03
prune_threshold = 0.20

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
