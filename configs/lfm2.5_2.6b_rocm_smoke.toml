# LFM2.5-2.6B (LiquidAI) on Linux ROCm gfx1151 — SMOKE TEST config.
# Hybrid architecture: 22 gated short-conv blocks + 8 GQA attention layers.
# Engine support verified: LFM2 modules registered in steerable_modules():
#   conv.out_proj / self_attn.out_proj -> "attn.o_proj" / feed_forward.w2 -> "mlp.down_proj"
# Tiny trial count to verify the LFM2 pipeline end-to-end before the full search.

[model]
model_id = "/run/media/s117/OS/Models/LFM2.5-2.6B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"

[inference]
batch_size = 64
min_batch_size = 1
max_batch_size = 128
max_gen_tokens = 150

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [1.0, 10.0]
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"mlp.down_proj" = [2.0, 10.0]
"attn.o_proj" = [1.0, 6.0]

[optimization]
num_trials = 8
num_warmup_trials = 4
checkpoint_dir = "checkpoints_lfm2.5_2.6b_smoke"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
