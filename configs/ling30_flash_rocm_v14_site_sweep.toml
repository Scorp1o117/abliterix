# Ling-3.0-flash v14 — controlled architecture-site causal localisation
#
# Replays v13 t2's exact strong/wide profile at four mutually exclusive sites:
# KDA output, MLA output, total MLP output, and shared-expert output.  Every
# trial intentionally terminates after the same 30-prompt prescreen; this is a
# matched causal comparison, not a Pareto search.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160
offload_outputs_to_cpu = true

[steering]
vector_method = "mean"
steering_mode = "adaptive_angular"
runtime_hook_site = "decoder_block"
search_runtime_hook_site = true
runtime_hook_site_choices = [
  "kda_output",
  "mla_output",
  "mlp_output",
  "shared_expert_output",
]
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = false
fixed_vector_scope = "per layer"
strength_range = [0.95, 1.00]
min_weight_frac_max = 0.35
auto_disable_components = []
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
  "mlp.down_proj",
]

[steering.component_strength_ranges]
"attn.o_proj" = [0.95, 1.00]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 4
num_warmup_trials = 4
checkpoint_dir = "checkpoints_ling30_flash_v14_site_sweep"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
# Diagnostic-only: classify every count as high so each seeded trial exits
# immediately after prescreen. Counts remain in trial user attrs.
refusal_prescreen_pass_max = 0
refusal_prescreen_prune_min = 0
refusal_prescreen_seed = 117
validation_kl_enabled = false
generation_health_enabled = false
thinking_leak_detection_enabled = false
seed_trials = [
  { runtime_hook_site = "kda_output", vector_scope = "per layer", vector_index = 30.25491805410134, "attn.o_proj.max_weight" = 0.9698154112336964, "attn.o_proj.max_weight_position" = 38.01626146913563, "attn.o_proj.min_weight" = 0.3145186120734486, "attn.o_proj.min_weight_distance" = 18.562455387145544 },
  { runtime_hook_site = "mla_output", vector_scope = "per layer", vector_index = 30.25491805410134, "attn.o_proj.max_weight" = 0.9698154112336964, "attn.o_proj.max_weight_position" = 38.01626146913563, "attn.o_proj.min_weight" = 0.3145186120734486, "attn.o_proj.min_weight_distance" = 18.562455387145544 },
  { runtime_hook_site = "mlp_output", vector_scope = "per layer", vector_index = 30.25491805410134, "attn.o_proj.max_weight" = 0.9698154112336964, "attn.o_proj.max_weight_position" = 38.01626146913563, "attn.o_proj.min_weight" = 0.3145186120734486, "attn.o_proj.min_weight_distance" = 18.562455387145544 },
  { runtime_hook_site = "shared_expert_output", vector_scope = "per layer", vector_index = 30.25491805410134, "attn.o_proj.max_weight" = 0.9698154112336964, "attn.o_proj.max_weight_position" = 38.01626146913563, "attn.o_proj.min_weight" = 0.3145186120734486, "attn.o_proj.min_weight_distance" = 18.562455387145544 },
]

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.70

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
