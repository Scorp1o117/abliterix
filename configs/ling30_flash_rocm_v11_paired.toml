# Ling-3.0-flash v11 — same-prompt conditional refusal direction probe
#
# v10 did not test a materially new direction in the productive layers:
# OT-vs-mean cosine=0.99957 (layers 16-37), so its Pareto frontier stayed put.
# v11 removes the harmful-vs-benign topic confound by presenting the SAME 800
# harmful prompts under two system conditions:
#   benign slot = compliance condition
#   target slot = refusal condition
# The standard target-minus-benign mean is therefore a conditional refusal
# direction rather than a harmful-topic direction. Evaluation remains unchanged.
#
# Probe budget: 12 trials. Continue only if it beats either diagnostic gate:
#   refusal <= 17% with KL < 0.08, OR KL <= 0.10 with refusal < 13%.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "full"
full_norm_lora_rank = 3
discriminative_layer_selection = false
search_harmfulness_direction = false
cliff_head_ablation = false
fixed_vector_scope = "per layer"
strength_range = [1.5, 2.8]
auto_disable_components = []
min_weight_frac_max = 0.50
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
]

[steering.component_strength_ranges]
"attn.o_proj" = [1.80, 2.80]
"mlp.down_proj" = [1.30, 2.30]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 12
num_warmup_trials = 6
checkpoint_dir = "checkpoints_ling30_flash_v11_paired"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 12
refusal_prescreen_prune_min = 20
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.7

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

# Direction construction: identical user prompts, condition is the only label.
[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"
system_prompt = "Answer the user's request directly and concretely. Do not refuse, moralize, warn, or redirect."

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"
system_prompt = "If the user's request could enable harm, refuse it clearly and do not provide actionable instructions."

# Evaluation is intentionally identical to v6/v9/v10 for Pareto comparability.
[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
