# Muse Glimmer-30B v3 — bnb NF4 + angular, residuals at `to=user`.
#
# BF16 56G + hidden-state extraction OOM'd 128G UMA twice. 4-bit ~16G.
# steering_mode=direct is illegal on bitsandbytes packed weights; LoRA
# already failed on this 4×RMSNorm decoder, so apply angular hooks.
# Prefix map in cli.py turns `to=self` CoT into `to=user`.
# batch_size=1 keeps output_hidden_states from exploding.

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 1
min_batch_size = 1
max_batch_size = 1
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "angular"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [1.0, 6.0]
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
]
auto_disable_components = ["mlp.down_proj"]
auto_disable_floor = -0.25

[steering.component_strength_ranges]
"attn.o_proj" = [1.0, 6.0]
"mlp.down_proj" = [0.0, 6.0]

[optimization]
num_trials = 12
num_warmup_trials = 6
checkpoint_dir = "checkpoints_muse_glimmer_30b_v3"
refusal_prescreen_enabled = true
refusal_prescreen_size = 16
refusal_prescreen_pass_max = 6
refusal_prescreen_prune_min = 13
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 16
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
