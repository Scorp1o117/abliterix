# Spark-X2.5-4B — mergeable direct ORBA/biprojected search
#
# SRA LoRA at o_proj≤6 still prescreen-pruned or KL≈0.18 at ~60/100 refuse.
# V1 mean LoRA opened refusals (trial 54: 8/100 @ KL 0.196) but LoRA
# coefficients are not the same units as direct. Direct ORBA/biprojected
# preserve row norm and are the mergeable quality path.

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Spark-X2.5-4B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true

[inference]
batch_size = 64
min_batch_size = 1
max_batch_size = 64
max_gen_tokens = 150
skip_common_response_prefix = true

[steering]
steering_mode = "direct"
direct_transform = "orba"
search_direct_transform = true
search_direct_transform_choices = ["standard", "orba", "biprojected"]
direct_transform_preserve_row_norm = true
vector_method = "mean"
decay_kernel = "gaussian"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = true
weight_normalization = "full"
strength_range = [0.2, 1.8]
auto_disable_components = ["mlp.down_proj", "attn.qkv_proj"]
auto_disable_floor = -0.35
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"attn.o_proj" = [0.25, 1.80]
"mlp.down_proj" = [0.10, 1.10]
"attn.qkv_proj" = [0.15, 1.20]

[optimization]
num_trials = 80
num_warmup_trials = 24
checkpoint_dir = "checkpoints_spark_x25_4b_orba_v4"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 100
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.03
prune_threshold = 0.22

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
