# Spark-X2.5-4B — SOM (Kohonen) correlated refusal directions
#
# HH on Sorry-vs-Sure vectors: 99/100 @ KL 0.0438, 75/100 @ 0.1335 — worse
# than mean HH (9/100 @ 0.182). SVD n_dir=3 (V10) exploded KL. SOM trains a
# 2x2 grid on harmful residuals; the 4 directions are correlated, not
# orthogonal (Piras et al. AAAI 2026). Distinct from mean / SVD / OT / PCA.
# Mergeable LoRA. HIT: refusals≤10/100 AND 3-token KL≤0.05 vs original.

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Spark-X2.5-4B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true

[inference]
batch_size = 64
min_batch_size = 1
max_batch_size = 64
max_gen_tokens = 150
skip_common_response_prefix = true

[steering]
vector_method = "som"
som_grid_h = 2
som_grid_w = 2
som_n_iters = 500
som_seed = 117
steering_mode = "lora"
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = true
decay_kernel = "gaussian"
weight_normalization = "full"
full_norm_lora_rank = 8
orthogonal_projection = true
strength_range = [0.8, 7.0]
auto_disable_components = ["mlp.down_proj"]
auto_disable_floor = -0.3
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"attn.o_proj" = [2.5, 6.5]
"attn.qkv_proj" = [0.4, 3.0]
"mlp.down_proj" = [0.0, 0.8]

[optimization]
num_trials = 30
num_warmup_trials = 10
checkpoint_dir = "checkpoints_spark_x25_4b_som_v24"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 100
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.03
prune_threshold = 0.12

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = true
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
