# Qwen-AgentWorld-35B-A3B on Windows ROCm + bitsandbytes 4-bit.
#
# Based on the Agents-A1 Qwen3.5-35B-A3B ROCm config that already works on
# this machine. This model uses Qwen3_5MoeForConditionalGeneration too.

[model]
model_id = "C:/Models/Qwen-AgentWorld-35B-A3B-unpacked-bnb"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "92GB", "cpu" = "24GB"}
trust_remote_code = true

[inference]
batch_size = 128
min_batch_size = 1
max_batch_size = 192
skip_common_response_prefix = true
max_gen_tokens = 100

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [1.0, 10.0]

[steering.component_strength_ranges]
"mlp.down_proj" = [2.0, 10.0]
"attn.o_proj" = [1.0, 6.0]
"attn.q_proj" = [0.5, 4.0]
"attn.k_proj" = [0.5, 4.0]
"attn.v_proj" = [0.5, 4.0]

[optimization]
num_trials = 80
num_warmup_trials = 20
checkpoint_dir = "checkpoints_qwen_agentworld_35b_a3b_rocm_bnb4bit"

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false
llm_judge_model = "deepseek-v4-flash"
llm_judge_base_url = "https://opencode.ai/zen/go/v1"
llm_judge_api_key_env = "LLM_JUDGE_API_KEY"
llm_judge_auth_header = "Authorization"
llm_judge_auth_prefix = "Bearer "
llm_judge_temperature = 0.0
llm_judge_use_response_format = false
llm_judge_max_tokens_field = "max_tokens"
llm_judge_reasoning_budget = 0
llm_judge_batch_size = 10
llm_judge_concurrency = 8

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "C:/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "C:/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "C:/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "C:/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
