# Nex-N2.5-mini (Nex-AGI) on Linux ROCm gfx1151 — Abliterix V1 search.
#
# Nex-N2.5-mini is a Nex-AGI post-trained Qwen3.5-35B-A3B derivative and is
# ARCHITECTURALLY IDENTICAL to Ornith-1.5-35B-A3B (40 layers, hidden 2048,
# 256 experts, moe_inter 512, GatedDeltaNet hybrid 3 linear + 1 full, BF16
# 70.2 GB on disk). The V4 recipe below is therefore transferred verbatim from
# Ornith-1.5, including its seed trials (same 40-layer indexing).
#
# Two model-specific points:
#   * text_only = true  — the checkpoint is a VL wrapper (Qwen3_5Moe
#     ForConditionalGeneration with a vision tower). Abliterix steers the
#     language model only; upstream moved this from an implicit model_type
#     check to this explicit switch.
#   * custom encoder    — the bundled template opens a bare <think> block
#     unless reasoning_effort is given; the encoder forces "none" so the
#     model answers instead of burning the eval budget on a thinking trace.
#
# Search space calibrated by configs/nex25_mini_rocm_sweep.toml (2026-09-10):
# baseline 8/8 refusals; 1.0x -> 0/8 @ KL 0.395, 0.5x -> 1/8 @ 0.122,
# 0.25x -> 6/8 @ 0.034. Ranges below bracket the 0.3x-1.1x window.
#
# BF16 (quant_method = "none"): the experts are fused 3-D tensors
# (mlp.experts.gate_up_proj / .down_proj, 64.4 GB = 92% of the checkpoint), so
# bitsandbytes would leave them in full precision anyway.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Nex-N2.5-mini"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true
# VL wrapper checkpoint: steer the language model only.
text_only = true
# Force reasoning_effort="none" (empty thinking block) for eval stability.
custom_encoder_module = "scripts/nex25_encode.py"
custom_encoder_kwargs = {reasoning_effort = "none"}

[inference]
batch_size = 128
min_batch_size = 1
max_batch_size = 128
skip_common_response_prefix = true
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "lora"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
discriminative_layer_selection = false
search_harmfulness_direction = false
strength_range = [0.5, 3.0]
disabled_components = []

[steering.component_strength_ranges]
"mlp.down_proj" = [3.0, 9.5]
"attn.o_proj" = [1.0, 3.5]
"attn.q_proj" = [0.4, 1.8]
"attn.k_proj" = [0.4, 1.8]
"attn.v_proj" = [0.4, 1.8]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 50
num_warmup_trials = 12
sampler_seed = 117
checkpoint_dir = "checkpoints_nex25_mini_v1"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 20
generation_health_enabled = true
thinking_leak_detection_enabled = true

