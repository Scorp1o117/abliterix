# Nex-N2.5-mini — V8: non-discriminative shape search for the compliant band.
#
# The ship bar makes refusals <=10 mandatory and treats KL as the graded axis
# (<=0.05 preferred, <=0.1 acceptable). discriminative_layer_selection lowers KL but
# caps at ~17 refusals (0.25x) and collapses generation above that strength (0.30x
# and 0.35x both FAILED health), so it cannot reach the refusal bar at all.
# Non-discriminative steering reaches 9/100 @ 0.0845 at 0.33x, so this wave searches
# shapes/strengths in that compliant band and prunes anything above KL 0.12.
#
# Nex-N2.5-mini — V6: 160-token convention (project house standard), KL<=0.05 target.
#
# Why 160: default.toml is 100, the Ornith/Ling/Qwen3.8 family runs are 160, and the
# refusal detector substring-matches 66 of its 67 markers ANYWHERE in the response —
# a longer cap inflates refusal counts with incidental keyword hits. 256 was adopted
# by mistake from the gpt-oss config and its numbers (22/21/18) are NOT comparable.
#
# Target: refusals <=10/100 at 3-token KL <=0.05 (0.1 only as a fallback).
# Existing frontier at 160: 0.25x -> 12/100 @ 0.0594; 0.33x -> 9/100 @ 0.0845,
# so KL efficiency must improve ~40% at equal refusal suppression.
# TRAP WORTH REMEMBERING: the '* Steerable components' banner only calls
# steerable_modules(0). Layer 0 is a linear_attention layer, so attn.q/k/v_proj
# (present only in the 10 full-attention layers) never appear there — they ARE
# steerable and DO matter: the same 0.25x profile reads 12/100 @ 0.0594 with
# q/k/v = 0.375 and 19/100 @ 0.0585 with q/k/v = 0. The Ornith V4 recipe's
# "ALL attention components on" is load-bearing; keep q/k/v in every seed.
#
# New lever: search_direct_transform samples standard / orba / biprojected as a TPE
# dimension. biprojected preserves every row's L2 norm exactly, which is precisely
# the axis that should buy KL at fixed refusal removal; orba adds double Gram-Schmidt
# orthogonalisation. The first three seeds are a same-strength A/B of the three.
#
# Cap calibration measured on the SAME profile (o 0.808 / down 2.298, KL identical
# at 0.0594): 160-token prescreen 6/30 and 12/100 full eval, 256-token prescreen
# 12/30 — the longer cap exposes late refusals and long-form degeneration that the
# 160-token run never sees (response-length deviation 0.21 -> 0.93). The gpt-oss
# notes record exactly this blind spot, and its shipped recipe runs at 256, so the
# 256 cap is the faithful target here; 160-token numbers stay comparable to the
# historical Ornith/Ling/Qwen3.8 bars.
#
# Prescreen bands widened (pass <=18/30, prune >=25/30) because the old 8/19 bands
# reduced the interesting 12-18/30 region to a 30-prompt extrapolation, so the
# search optimised an estimate instead of a measurement.
#
# v2 (direct+EGA, norm=none, no routing) plateaued at 11-12/100 refusals @ KL 0.06-0.15.
# A full-vs-none A/B (configs/nex25_mini_rocm_sweep_full.toml) showed the Ling lesson
# (norm=full as the only low-KL basin) does NOT transfer here: curves overlap within
# noise. Remaining untried lever is the one the shipped gpt-oss recipe uses:
# direct + EGA on fused experts + MoE router suppression (6/100 @ KL 0.0098 there).
# (Removed the earlier 256-token experiment: it inflated refusal counts via incidental
# keyword hits; see the v6 header above.)
#
# V1 (LoRA) was aborted during its baseline phase after the A/B sweep showed that
# LoRA can only reach the shared expert: fused experts cannot be wrapped by PEFT,
# so the 256-expert path (92% of the checkpoint) was never steered. Direct mode
# runs Expert-Granular Abliteration across all 256 experts and is ~7x more
# KL-efficient here (0/8 refusals at KL 0.052 vs 0.395 for LoRA; see
# configs/nex25_mini_rocm_sweep_direct.toml vs nex25_mini_rocm_sweep.toml).
#
# Nex-N2.5-mini is a Nex-AGI post-trained Qwen3.5-35B-A3B derivative and is
# ARCHITECTURALLY IDENTICAL to Ornith-1.5-35B-A3B (40 layers, hidden 2048,
# 256 experts, moe_inter 512, GatedDeltaNet hybrid 3 linear + 1 full, BF16
# 70.2 GB on disk). The V4 recipe below is therefore transferred verbatim from
# Ornith-1.5, including its seed trials (same 40-layer indexing).
#
# Two model-specific points:
#   * text_only = true  — the checkpoint is a VL wrapper (Qwen3_5Moe
#     ForConditionalGeneration with a vision tower). Abliterix steers the
#     language model only; upstream moved this from an implicit model_type
#     check to this explicit switch.
#   * custom encoder    — the bundled template opens a bare <think> block
#     unless reasoning_effort is given; the encoder forces "none" so the
#     model answers instead of burning the eval budget on a thinking trace.
#
# Search space calibrated by configs/nex25_mini_rocm_sweep.toml (2026-09-10):
# baseline 8/8 refusals; 1.0x -> 0/8 @ KL 0.395, 0.5x -> 1/8 @ 0.122,
# 0.25x -> 6/8 @ 0.034. Ranges below bracket the 0.3x-1.1x window.
#
# BF16 (quant_method = "none"): the experts are fused 3-D tensors
# (mlp.experts.gate_up_proj / .down_proj, 64.4 GB = 92% of the checkpoint), so
# bitsandbytes would leave them in full precision anyway.

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Nex-N2.5-mini"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true
# VL wrapper checkpoint: steer the language model only.
text_only = true
# Force reasoning_effort="none" (empty thinking block) for eval stability.
custom_encoder_module = "scripts/nex25_encode.py"
custom_encoder_kwargs = {reasoning_effort = "none"}

[inference]
batch_size = 128
min_batch_size = 1
max_batch_size = 128
skip_common_response_prefix = true
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "direct"
# Historical detector behaviour: classify the raw response. The optional
# detection.strip_thinking_blocks switch shifts the metric at this cap — the
# model truncates inside its own thinking block, and stripping turns those into
# empty => refusal (same recipe read 19/100 instead of the historical 12/100).
strip_thinking_blocks = false
direct_transform = "standard"   # A/B winner; fixed
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
discriminative_layer_selection = false
search_harmfulness_direction = false
strength_range = [0.5, 1.6]
min_weight_frac_max = 0.6
disabled_components = []

[steering.component_strength_ranges]
"mlp.down_proj" = [1.8, 4.2]
"attn.o_proj" = [0.6, 1.5]
"attn.q_proj" = [0.2, 0.8]
"attn.k_proj" = [0.2, 0.8]
"attn.v_proj" = [0.2, 0.8]

# Router suppression ON (shipped gpt-oss recipe: direct + EGA on fused experts +
# MoE router suppression gave 6/100 @ KL 0.0098). Expert ablation stays pinned
# off — EGA already owns the expert down_proj weights.
# Router suppression is a proven negative on this model (prescreen 5/30 -> 9/30,
# KL 0.0845 -> 0.1554), so it stays out of the search space.
[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 60
num_warmup_trials = 16
sampler_seed = 117
checkpoint_dir = "checkpoints_nex25_mini_v8"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 18
refusal_prescreen_prune_min = 25
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 20
generation_health_enabled = true
thinking_leak_detection_enabled = true

