# Muse Glimmer-30B v3 best — trial 12 (lowest KL among 10/16 prescreens).
#
# Baseline 95/100. Per-layer angular only moved the needle; single-layer
# vector_index trials all pruned at 15/16. Trial 12: 10/16 (~62/100 est),
# KL 0.0274 nats/token, length 0.63σ. Angular is runtime-only — this file
# reapplies hooks, it does not bake weights.

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GB", "cpu" = "20GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 1
min_batch_size = 1
max_batch_size = 1
skip_common_response_prefix = false
min_gen_tokens = 32
max_gen_tokens = 160

[steering]
steering_mode = "angular"
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
fixed_vector_scope = "per layer"
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
]

[steering.component_strength_ranges]
"attn.o_proj" = [1.20, 1.20]
"mlp.down_proj" = [5.16, 5.16]

[optimization]
num_trials = 1
num_warmup_trials = 0
checkpoint_dir = "checkpoints_muse_glimmer_30b_v3"
refusal_prescreen_enabled = false
validation_kl_enabled = true
validation_kl_size = 16

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

non_interactive = true
overwrite_checkpoint = false
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
