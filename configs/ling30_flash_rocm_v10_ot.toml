# Ling-3.0-flash v10 — Optimal Transport direction (new vector family)
#
# Evidence synthesis (v1–v9):
#   ✗ mean+MPOA exhausted: best dual-ish KL 0.093 / ref 17% (v6 t21)
#   ✗ raising ceiling to o2.9/d2.7 only shifts Pareto (v9: KL 0.11–0.16 / ref 13–15%)
#   ✗ SRA, cliff-head, expert routing, default none: all falsified
#   ✓ MPOA full+r3 is the ONLY low-KL write path on Ling
#   ✓ o_proj + down_proj both ON, per-layer vectors
#
# v10 design (break the Pareto frontier with a NEW direction family):
#   1. vector_method = "optimal_transport" — PCA-Gaussian OT captures
#      mean + covariance structure, not just mean difference
#   2. Keep MPOA full+r3 (the only thing that gives KL < 0.10 on Ling)
#   3. Wider strength band than v9 to let OT breathe:
#        o_proj ∈ [1.5, 3.2]   d ∈ [1.2, 3.0]
#      (OT directions may need different magnitudes than mean-diff)
#   4. ot_components = 2 (default; captures dominant shared subspace)
#   5. projected_abliteration = true (grimjim method, preserve helpfulness)
#   6. orthogonal_projection = true (redundant with projected, but harmless)
#   7. winsorize = true (outlier robustness)
#   8. No cliff / SRA / experts / harmfulness pair (falsified)
#   9. batch=16, 40 trials (probe budget; stop if no dual progress by trial 20)
#
# Goal (selection): KL ≤ 0.05 AND refusals ≤ 10/100

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160

[steering]
vector_method = "optimal_transport"
ot_components = 2
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "full"
full_norm_lora_rank = 3
discriminative_layer_selection = false
search_harmfulness_direction = false
cliff_head_ablation = false

# All productive finite trials were per-layer; global = waste.
fixed_vector_scope = "per layer"

# Fallback global band (components override below)
strength_range = [1.5, 3.2]

auto_disable_components = []
min_weight_frac_max = 0.45

# OT may benefit from slightly lower min_weight_frac — let early layers breathe
disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
]

[steering.component_strength_ranges]
# Wider than v9: OT directions may need different magnitudes
# v9 winners were o~2.4, d~1.7; OT may shift this
"attn.o_proj" = [1.50, 3.20]
"mlp.down_proj" = [1.20, 3.00]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 40
num_warmup_trials = 10
checkpoint_dir = "checkpoints_ling30_flash_v10_ot"

refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 12
refusal_prescreen_prune_min = 20
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.7

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
