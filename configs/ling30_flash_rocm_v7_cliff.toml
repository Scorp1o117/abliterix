# Ling-3.0-flash v7 — cliff-head pre-ablation + light o_proj LoRA probe
#
# Context (v4–v6 classical mean+MPOA):
#   • Low-KL basin exists (KL ~0.03–0.10) but dual goal not hit
#     (best dual-ish ~KL 0.09 / refuse 16–21%; typical OK ~30–50% refuse)
#   • Stacking trials did not open a new basin → pivot
#
# Method (option B):
#   1. cliff_head_ablation = true  — fixed base edit ONCE before Optuna
#      (top ~4% pro-refusal o_proj heads × strength 0.75)
#   2. Light LoRA search on attn.o_proj ONLY (no down_proj / experts / SRA)
#   3. Keep MPOA write (full + rank 3) — Ling's only known low-KL path
#   4. ~10 trials, batch 16, new checkpoint dir
#
# bnb note: cliff_head dequant → edit → requant o_proj (Params4bit-safe).
# If log shows "matched no heads", fall back is still the light o_proj search.
#
# Goal (selection): KL ≤ 0.05 AND refusals ≤ 10/100

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
# MPOA-style LoRA write — required for Ling low-KL basin
weight_normalization = "full"
full_norm_lora_rank = 3
discriminative_layer_selection = false
search_harmfulness_direction = false

# --- Cliff-head fixed pre-ablation (Bao et al. 2025) ---
cliff_head_ablation = true
cliff_head_top_k_frac = 0.04
cliff_head_strength = 0.75

# v4 finite hits were per-layer; keep that for the light LoRA stage
fixed_vector_scope = "per layer"

# Light LoRA on top of cliff — not the v5/v6 high-strength band
strength_range = [0.3, 1.2]

disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
  "mlp.down_proj",
]

auto_disable_components = []
min_weight_frac_max = 0.6

[steering.component_strength_ranges]
"attn.o_proj" = [0.3, 1.2]

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 10
num_warmup_trials = 4
checkpoint_dir = "checkpoints_ling30_flash_v7_cliff"

refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 10
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.7

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
