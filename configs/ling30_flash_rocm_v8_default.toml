# Ling-3.0-flash v8 — Abliterix *default* method (not Ornith / MPOA)
#
# Explicitly NOT:
#   - weight_normalization = "full" (Ornith / MPOA rank-3 write)
#   - cliff_head_ablation
#   - SRA / optimal_transport / harmfulness pair
#   - Laguna-style expert suppress / router bias
#   - Narrow "productive cluster" strength bands from v4–v6
#
# IS (Abliterix defaults from settings.py + default.toml):
#   - vector_method = mean
#   - steering_mode = lora (implicit)
#   - weight_normalization = none
#   - orthogonal_projection = true  (default.toml)
#   - projected_abliteration / winsorize OFF (code defaults)
#   - strength_range = [0.8, 1.5]   (code default)
#   - auto_disable_components includes mlp.down_proj (code default)
#
# Machine-only: bnb4bit, batch=16, paths, o_proj discovery (Bailing dense).
# Residual-output components only (q/k/v off) — same as stock MoE recipes,
# not an Ornith change.
#
# Goal (selection): KL ≤ 0.05 AND refusals ≤ 10/100

system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Ling-3.0-flash"
dtype_fallback_order = ["float16"]
quant_method = "bnb_4bit"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
trust_remote_code = true

[inference]
batch_size = 16
min_batch_size = 16
max_batch_size = 16
skip_common_response_prefix = true
max_gen_tokens = 160

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = false
winsorize_vectors = false
weight_normalization = "none"
discriminative_layer_selection = false
search_harmfulness_direction = false
cliff_head_ablation = false

# Abliterix code default peak strength band
strength_range = [0.8, 1.5]

# Default auto-disable: TPE may set down_proj max_weight → 0 in a trial
# (settings default). Leave empty overrides so global strength_range applies.
auto_disable_components = ["mlp.down_proj"]

disabled_components = [
  "attn.q_proj",
  "attn.k_proj",
  "attn.v_proj",
  "attn.q_b_proj",
  "attn.kv_b_proj",
]

# No per-component Ornith/v5 narrow bands — both o_proj and down_proj
# sample from strength_range above.

[experts]
max_suppress = 0
router_bias_range = [0.0, 0.0]
ablation_weight_range = [0.0, 0.0]

[optimization]
num_trials = 40
num_warmup_trials = 12
checkpoint_dir = "checkpoints_ling30_flash_v8_default"

refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
