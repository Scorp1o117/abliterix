# Spark-X2.5-1.7B — V4 mean LoRA, widened box, keep searching until dual HIT
#
# V1–V3 o_proj [2,8] never sampled Heretic's opening region (~1.3–1.5).
# V4: o [auto-off, 12], qkv [auto-off, 8], down [auto-off, 2.5], KL prune 0.6.
# Seeds: V3 open/mid Pareto + Heretic low-o no-qkv. Wrapper raises num_trials
# by 400 until refusals≤10 and 3-token KL≤0.1. Bake only on dual HIT.

non_interactive = true
overwrite_checkpoint = false
system_prompt = "You are a helpful assistant."

[model]
model_id = "/run/media/s117/OS/Models/Spark-X2.5-1.7B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
trust_remote_code = true

[inference]
batch_size = 64
min_batch_size = 1
max_batch_size = 64
max_gen_tokens = 150
skip_common_response_prefix = true

[steering]
vector_method = "mean"
steering_mode = "lora"
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
discriminative_layer_selection = true
decay_kernel = "gaussian"
weight_normalization = "full"
full_norm_lora_rank = 8
orthogonal_projection = true
strength_range = [0.5, 12.0]
auto_disable_components = ["attn.o_proj", "attn.qkv_proj", "mlp.down_proj"]
auto_disable_floor = -0.5
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"attn.o_proj" = [0.5, 12.0]
"attn.qkv_proj" = [0.0, 8.0]
"mlp.down_proj" = [0.0, 2.5]

[optimization]
num_trials = 1200
num_warmup_trials = 8
checkpoint_dir = "checkpoints_spark_x25_1p7b_lora_v4"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 24
refusal_prescreen_prune_min = 25
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 100
generation_health_enabled = true
thinking_leak_detection_enabled = true

