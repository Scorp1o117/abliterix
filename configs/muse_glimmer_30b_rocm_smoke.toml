# Muse Glimmer-30B (Meta Superintelligence Lab) on Linux ROCm gfx1151 — SMOKE.
#
# Dense 29.6B VLM, 52-layer decoder, hidden 6656, GQA 32/2, SwiGLU,
# gated attention (sigmoid gate then o_proj), sliding/full [L,L,L,G]×13.
# Wrapper: MuseGlimmerForConditionalGeneration → model.language_model.layers.
# Engine already discovers self_attn.{q,k,v,o}_proj + mlp.down_proj; no
# library change. Needs transformers 5.15 (isolated env, do not upgrade
# heretic-env). Native BF16 ~56G fits 128G UMA with headroom.
#
# Recipe: local LFM/Ling o_proj+down_proj projected abliteration, tiny
# trial budget, keyword judge. Chat template forced to reasoning_strength=low
# via scripts/muse_glimmer_encode.py so CoT does not eat the token budget.

[model]
model_id = "/run/media/s117/OS/Models/Muse-Glimmer-30B"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "104GB", "cpu" = "16GB"}
custom_encoder_module = "scripts/muse_glimmer_encode.py"
custom_encoder_kwargs = {reasoning_strength = "low"}

[inference]
batch_size = 8
min_batch_size = 1
max_batch_size = 16
skip_common_response_prefix = true
min_gen_tokens = 64
max_gen_tokens = 200

[steering]
vector_method = "mean"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
winsorize_quantile = 0.995
weight_normalization = "none"
strength_range = [1.0, 10.0]
disabled_components = ["attn.q_proj", "attn.k_proj", "attn.v_proj"]

[steering.component_strength_ranges]
"mlp.down_proj" = [2.0, 10.0]
"attn.o_proj" = [1.0, 6.0]

[optimization]
num_trials = 8
num_warmup_trials = 4
checkpoint_dir = "checkpoints_muse_glimmer_30b_smoke"
refusal_prescreen_enabled = true
refusal_prescreen_size = 30
refusal_prescreen_pass_max = 8
refusal_prescreen_prune_min = 19
refusal_prescreen_seed = 117
validation_kl_enabled = true
validation_kl_size = 30
generation_health_enabled = true
thinking_leak_detection_enabled = true

[kl]
scale = 1.0
token_count = 3
target = 0.005
prune_threshold = 0.5

[detection]
llm_judge = false

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

non_interactive = true
overwrite_checkpoint = true
system_prompt = "You are a helpful assistant."

[benign_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/good_1000"
split = "train[900:]"
column = "prompt"

[target_eval_prompts]
dataset = "/run/media/s117/OS/Users/15403/Documents/abliterix-datasets/harmful_1000"
split = "train[900:]"
column = "prompt"
